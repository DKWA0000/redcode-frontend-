<div class="d-flex" id="wrapper">
  
  <!-- 1. Sidanvisaren visas ENDAST om showSidebar är sant -->
  @if (showSidebar) {
    <div class="bg-dark text-white border-end d-flex flex-column" id="sidebar-wrapper" [class.toggled]="isSidebarCollapsed">
      <div class="sidebar-heading border-bottom p-3 fs-5 fw-bold">Menu</div>
      
      <div class="list-group list-group-flush flex-grow-1">
        <a routerLink="/dashboard" routerLinkActive="active" class="list-group-item list-group-item-action bg-dark text-white-50 p-3 border-0">
           📚 Mina Böcker
        </a>
        <a routerLink="/quotes" routerLinkActive="active" class="list-group-item list-group-item-action bg-dark text-white-50 p-3 border-0">
           <fa-icon [icon]="iconQuote" class="me-2 text-white-50"></fa-icon> Mina Citat
        </a>
      </div>

      <div class="p-3 border-top border-secondary bg-dark">
        <button class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2" (click)="toggleDarkMode()">
          @if (isDarkMode) {
            <fa-icon [icon]="iconSun" class="text-warning"></fa-icon> Ljust läge
          } @else {
            <fa-icon [icon]="iconMoon"></fa-icon> Mörkt läge
          }
        </button>
      </div>

    </div>
  }

  <!-- 2. Huvudinnehållet -->
  <div id="page-content-wrapper" class="w-100 bg-light d-flex flex-column min-vh-100">
    
    <!-- Dölj även topp-navigeringen (menyknappen) på login/create-user -->
    @if (showSidebar) {
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-2">
        <button class="btn btn-outline-dark" (click)="toggleSidebar()">
          ☰
        </button>
      </nav>
    }

    <div class="container-fluid p-4 flex-grow-1 d-flex flex-column justify-content-center">
      
      <!-- Visar loggan och titeln överallt -->
      <div class="text-center mt-4 mb-5">
        <fa-icon [icon]="iconBook" style="color: green; font-size: 3rem;"></fa-icon>
        <h1 class="mt-2 fw-bold">BookList App</h1>
      </div>

      <!-- Inloggningskomponenten eller boksidorna laddas här -->
      <div class="bg-white p-4 rounded shadow-sm">
        <router-outlet></router-outlet>
      </div>

    </div>
  </div>

</div>
