<div class="container quotes-container my-5">
  
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="m-0">Alla Citat</h2>
    <button [routerLink]="['/add-quote']" class="add-btn">+ Nytt citat</button>
  </div>

  <!-- 🟢 Gamla back-btn-länken är helt borttagen härifrån! -->
  
  @if (quotes().length === 0) {
    <p class="no-quotes text-center p-4 border rounded bg-light text-muted">Inga citat hittades i applikationen.</p>
  } @else {
    <ul class="quotes-list list-unstyled d-flex flex-column gap-3">
      @for (item of quotes(); track item.quoteId) {
        
        <li class="quote-item d-flex justify-content-between align-items-center p-3 border rounded shadow-sm bg-white">
          <div class="quote-content flex-grow-1 pe-3">
            <blockquote class="quote-text m-0 fst-italic">"{{ item.quote }}"</blockquote>
          </div>
          
          <div class="footer-actions d-flex gap-2">
            <button class="edit-btn" 
                [routerLink]="['/edit-quote', item.quoteId]" 
                [state]="{ quote: item }" 
                title="Redigera citat">
                <fa-icon [icon]="iconEdit"></fa-icon>
            </button>

            <button class="delete-btn" (click)="deleteQuote(item, $event)" title="Radera citat">
              <fa-icon [icon]="iconTrash"></fa-icon>
            </button>
          </div>
        </li>

      }
    </ul>
  }
</div>
