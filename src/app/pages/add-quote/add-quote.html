<div class="container add-quote-container my-5">
  
  <h2 class="mb-4">Lägg till nytt citat</h2>

  <form (ngSubmit)="saveQuote()">
    
    <div class="form-group mb-4">
      <label for="quote" class="d-block mb-2">Citattext:</label>
      <textarea 
        id="quote" 
        [(ngModel)]="quoteText" 
        name="quote" 
        class="w-100"
        placeholder="Skriv citatet här..." 
        rows="5"
        required>
      </textarea>
    </div>

    <div class="button-group">
      
      <button type="submit" class="save-btn">
        Spara citat
      </button>

      <!-- 🟢 ÄNDRAD: Länkar nu direkt till /quotes istället för en specifik bok -->
      <button type="button" routerLink="/quotes" class="back-btn">
        Avbryt
      </button>

    </div>
  </form>
</div>
