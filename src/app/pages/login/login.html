<div class="container login-container my-5">
  <h2 class="mb-4 text-center">Login to Redcode</h2>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <div class="login-input-group mb-1" [class.is-invalid]="emailInvalid">
      <fa-icon [icon]="iconEmail" class="field-icon"></fa-icon>
      <input 
        type="email" 
        formControlName="email" 
        placeholder="Enter your email" />
    </div>
    @if (emailInvalid) {
      <small class="error-text d-block mb-3">Please enter a valid email address.</small>
    }

    <div class="login-input-group mb-1" [class.is-invalid]="passwordInvalid">
      <fa-icon [icon]="iconLock" class="field-icon"></fa-icon>
      <input 
        type="password" 
        formControlName="password" 
        placeholder="Enter your password" />
    </div>
    @if (passwordInvalid) {
      <small class="error-text d-block mb-4">Password must be at least 6 characters long.</small>
    }

    <button type="submit" class="login-btn" [disabled]="loginForm.invalid">
      Log In
    </button>

  </form>

  <div class="register-redirect mt-4 text-center">
    <button routerLink="/register" class="secondary-btn">Skapa ett konto</button>
  </div>
</div>
