<div class="container dashboard-container my-5">
  
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="m-0">Mina Böcker</h2>
    <button routerLink="/add-book" class="add-btn">+ Ny bok</button>
  </div>

  <div class="cards-list">
    
    @for (book of books(); track book.id) {
      
      <div class="action-card" (click)="onCardClick(book)" tabindex="0">
        
        <div class="card-body-content">
          <h3 class="book-title text-truncate" [title]="book.title">{{ book.title }}</h3>
          
          <div class="book-meta">
            <p class="author-text text-muted text-truncate" [title]="book.author">Av: {{ book.author }}</p>
            <span class="date-text text-muted">| Publicerad: {{ book.date | date:'yyyy-MM-dd' }}</span>
          </div>
        </div>
        
        <div class="card-actions" (click)="$event.stopPropagation()">
          
          <div class="action-icons">
            <button class="edit-btn" 
                    [routerLink]="['/edit-book', book.id]" 
                    [state]="{ book: book }" 
                    title="Redigera bok">
              <fa-icon [icon]="iconEdit"></fa-icon>
            </button>

            <button class="delete-btn" (click)="deleteBook(book.id, $event)" title="Radera bok">
              <fa-icon [icon]="iconTrash"></fa-icon>
            </button>
          </div>
          
        </div>

      </div>

    } @empty {
      <div class="empty-state text-center p-5 border rounded-3 bg-light">
        <p class="m-0 text-muted">Det finns inga böcker i listan just nu.</p>
      </div>
    }
    
  </div>
</div>
